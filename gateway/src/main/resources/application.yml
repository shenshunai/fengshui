server:
  port: 8080

spring:
  application:
    name: platform-gateway
  cloud:
    gateway:
      # HTTP 客户端超时，避免慢下游拖死网关
      httpclient:
        connect-timeout: 3000
        response-timeout: 30s
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 鉴权：/api/auth/** -> auth-service
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        # 购物（占位）
        - id: shopping-service
          uri: lb://shopping-service
          predicates:
            - Path=/api/shopping/**
          filters:
            - RewritePath=/api/shopping(?<segment>/?.*), /api${segment}
        # 玄学及默认：/api/** -> xuanxue-service
        - id: xuanxue-service
          uri: lb://xuanxue-service
          predicates:
            - Path=/api/**
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: when_authorized
    gateway:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    # 生产可改为 INFO：org.springframework.cloud.gateway: INFO
