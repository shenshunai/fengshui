server:
  port: 8080

spring:
  application:
    name: platform-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 购物（占位，更具体路径优先）
        - id: shopping-service
          uri: lb://shopping-service
          predicates:
            - Path=/api/shopping/**
          filters:
            - RewritePath=/api/shopping(?<segment>/?.*), /api${segment}
        # 玄学及默认：/api/** -> xuanxue-service
        - id: xuanxue-service
          uri: lb://xuanxue-service
          predicates:
            - Path=/api/**
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
