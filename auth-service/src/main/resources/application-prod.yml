server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:xuanxue}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:xuanxue}
    password: ${DB_PASSWORD:xuanxue123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

jwt:
  secret: ${JWT_SECRET:XuanXueAppSecretKeyForJWTTokenGeneration2024VeryLongAndSecure}
  access-expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    root: INFO
