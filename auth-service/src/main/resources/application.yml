server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

jwt:
  secret: XuanXueAppSecretKeyForJWTTokenGeneration2024VeryLongAndSecure
  access-expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    root: INFO
    com.platform.auth: DEBUG
