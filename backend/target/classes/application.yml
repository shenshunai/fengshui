server:
  port: 8080

spring:
  application:
    name: xuanxue-app
  
  # 数据源配置 (开发环境使用H2)
  datasource:
    url: jdbc:h2:mem:xuanxuedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      timeout: 3000

# JWT配置
jwt:
  secret: XuanXueAppSecretKeyForJWTTokenGeneration2024VeryLongAndSecure
  access-expiration: 86400000  # 24小时
  refresh-expiration: 604800000  # 7天

# 日志配置
logging:
  level:
    root: INFO
    com.xuanxue: DEBUG
    org.hibernate.SQL: DEBUG

# OpenAPI文档
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
