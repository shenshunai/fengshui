server:
  port: 8899

spring:
  application:
    name: xuanxue-app
  
  # 数据源配置 (开发环境使用H2)
  datasource:
    url: jdbc:h2:mem:xuanxuedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # 启动时执行建表脚本
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      timeout: 3000

# JWT配置
jwt:
  secret: XuanXueAppSecretKeyForJWTTokenGeneration2024VeryLongAndSecure
  access-expiration: 86400000  # 24小时
  refresh-expiration: 604800000  # 7天

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 日志配置
logging:
  level:
    root: INFO
    com.xuanxue: DEBUG
    com.xuanxue.mapper: DEBUG

# AI 服务（Python 调用 ChatGPT），不配置则使用本地规则生成
ai:
  service:
    enabled: true
    url: http://localhost:9000

# OpenAPI文档
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
